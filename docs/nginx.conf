# =====================================================
# Co-op System — Nginx (HTTPS, โดเมนจริง coop.computing.kku.ac.th)
# ใช้หลังได้ cert แล้ว: copy ไป C:\nginx\conf\nginx.conf บน VM → nginx -t → nginx -s reload
# ขั้นตอนย้ายจาก ngrok ทั้งหมด: docs\domain-migration.md
# =====================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ซ่อน version ของ Nginx
    server_tokens off;

    # จำกัดขนาด request body (backend จำกัดไฟล์ละ 50MB)
    client_max_body_size 52m;

    # บีบอัด JS/CSS/JSON — หน้าแรกโหลดเร็วขึ้นมากสำหรับผู้ใช้นอกมหาวิทยาลัย
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Rate limiting (backend มี limit ของตัวเองอีกชั้น)
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # X-Forwarded-For ที่ส่งให้ backend — ใช้นับ rate limit ต่อคน
    #   มาจาก ngrok agent ในเครื่อง (127.0.0.1) → XFF ของ ngrok มี IP ผู้ใช้จริงอยู่แล้ว ต่อท้ายตามปกติ
    #   ต่อตรงจากผู้ใช้ → ใช้ IP ที่ต่อเข้ามาเท่านั้น ไม่เชื่อ XFF ที่ client ส่งมาเอง (ปลอม IP หลบ rate limit หน้า login ได้)
    # backend ตั้ง trust proxy = 2 (TRUST_PROXY_HOPS) ได้ IP ถูกทั้งสองทาง ไม่ต้องแก้ .env
    map $remote_addr $client_xff {
        127.0.0.1 $proxy_add_x_forwarded_for;
        ::1       $proxy_add_x_forwarded_for;
        default   $remote_addr;
    }

    # HTTP (port 80) → https://coop.computing.kku.ac.th เสมอ
    # รวมการเข้าด้วย IP ของ VM และลิงก์ ngrok เดิม (ngrok ส่งเข้า port 80) → ลิงก์เก่าพาไปเว็บใหม่
    # ใช้ชื่อโดเมนตายตัว (ไม่ใช่ $host) — redirect ไป https://<IP> หรือ https://<ngrok> จะเจอ cert ไม่ตรง/วนไม่จบ
    server {
        listen 80 default_server;
        server_name _;

        # Let's Encrypt ต่ออายุ cert ผ่าน HTTP — ต้องตอบตรงนี้ ไม่ redirect
        location ^~ /.well-known/acme-challenge/ {
            root C:/letsencrypt/webroot;
            default_type text/plain;
        }

        location / {
            return 301 https://coop.computing.kku.ac.th$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name coop.computing.kku.ac.th;

        # cert จาก win-acme (Let's Encrypt) — ดู docs\lets-encrypt-setup.md
        ssl_certificate     C:/nginx/ssl/cert.pem;
        ssl_certificate_key C:/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers (API ได้จาก Helmet อีกชั้น · ตรงนี้คุมหน้าเว็บ/ไฟล์ static)
        # location ไหนมี add_header ของตัวเอง จะไม่ได้ชุดนี้ — ใช้ expires แทน add_header Cache-Control
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # ป้องกัน path traversal
        if ($request_uri ~* "\.\.") {
            return 400;
        }

        location ^~ /.well-known/acme-challenge/ {
            root C:/letsencrypt/webroot;
            default_type text/plain;
        }

        # ป้องกัน hidden files (.env, .git, etc.)
        location ~ /\. {
            deny all;
            return 404;
        }

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $client_xff;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~* ^/api/auth/(signin|login) {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:5000;
        }

        # หน้าสถานะเครื่อง (ไม่ต้อง login) — เปิดเฉพาะในเครื่องผ่าน 127.0.0.1:8888 (server ด้านล่าง)
        location ^~ /api/internal-status { return 404; }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;
            # zip หนังสือ/ส่งออก Excel/นำเข้านักศึกษาหลายร้อยแถวใช้เวลาเกิน 60 วินาที (ค่าเริ่มของ nginx) ได้
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://127.0.0.1:5000;
        }

        location /uploads/ {
            proxy_pass http://127.0.0.1:5000;
        }

        root C:/Co_project/Frontend/dist;

        # ไฟล์ที่ vite ใส่ hash ในชื่อ — เปลี่ยนเนื้อหา = เปลี่ยนชื่อ จึง cache ได้นาน
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # หน้า SPA — ไม่ cache index.html ไม่งั้นหลัง deploy ผู้ใช้ได้หน้าเก่าที่อ้างไฟล์ JS ที่ไม่มีแล้ว (หน้าขาว)
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }

    # หน้าสถานะเครื่อง — ฟังเฉพาะ 127.0.0.1 เปิดได้จากในเครื่อง VM เท่านั้น (http://localhost:8888/status.html)
    server {
        listen 127.0.0.1:8888;
        root   C:/Co_project/Frontend/dist;
        location /api/internal-status {
            proxy_pass http://127.0.0.1:5000/api/internal-status;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
