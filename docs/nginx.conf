# =====================================================
# Co-op System — Hardened Nginx Config
# Copy to C:\nginx\conf\nginx.conf on VM
# =====================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ซ่อน version ของ Nginx — ไม่ให้ attacker รู้ว่าใช้ version อะไร
    server_tokens off;

    # จำกัดขนาด request body — ป้องกัน DoS ผ่านการส่งไฟล์ขนาดใหญ่
    client_max_body_size 52m;

    # Rate limiting zones
    # login zone: จำกัด 10 req/นาที ต่อ IP (backend มี limit อยู่แล้ว, นี่เป็น layer นอก)
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    # api zone: 100 req/วินาที ต่อ IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # SSL — ใส่ path cert ที่ได้รับจาก IT มหาลัย
        ssl_certificate     C:/nginx/ssl/cert.pem;
        ssl_certificate_key C:/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers (Helmet จัดการ headers ส่วนใหญ่แล้ว นี่เป็น layer Nginx)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ป้องกัน path traversal
        if ($request_uri ~* "\.\.") {
            return 400;
        }

        # ป้องกัน hidden files (.env, .git, etc.)
        location ~ /\. {
            deny all;
            return 404;
        }

        # Rate limit สำหรับ login endpoint
        location ~* ^/api/auth/(signin|login) {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API routes — rate limit ระดับปกติ
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded files
        location /uploads/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (React SPA)
        location / {
            root C:/Co_project/Frontend/dist;
            try_files $uri $uri/ /index.html;
        }
    }
}
