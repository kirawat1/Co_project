# =====================================================
# Co-op System — HTTP-only config (ใช้ระหว่างรอ SSL cert)
# Copy to C:\nginx\conf\nginx.conf บน VM
# เมื่อได้ SSL cert แล้ว → เปลี่ยนกลับเป็น nginx.conf
# =====================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 52m;

    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    server {
        listen 80;
        server_name coop.computing.kku.ac.th;

        # Let's Encrypt ACME challenge — ต้องมีก่อน block /\. เพราะ .well-known ขึ้นต้นด้วย dot
        location /.well-known/acme-challenge/ {
            root C:/letsencrypt/webroot;
            default_type text/plain;
        }

        location ~ /\. {
            deny all;
            return 404;
        }

        location ~* ^/api/auth/(signin|login) {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root C:/Co_project/Frontend/dist;
            try_files $uri $uri/ /index.html;
        }
    }
}
