# =====================================================
# Co-op System — Nginx ช่วงขอ cert (HTTP เท่านั้น · ngrok ยังใช้งานตามปกติ)
# ขั้นที่ 1 ของ docs\domain-migration.md: copy ไป C:\nginx\conf\nginx.conf → nginx -t → nginx -s reload
# ได้ cert แล้ว → เปลี่ยนเป็น docs\nginx.conf
# =====================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 52m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # มาจาก ngrok agent ในเครื่อง → เชื่อ X-Forwarded-For/-Proto ของ ngrok (มี IP ผู้ใช้จริง, https)
    # ต่อตรงด้วยโดเมน/IP → ใช้ค่าที่ nginx เห็นเอง ไม่เชื่อ header ที่ client ส่งมา (ปลอม IP หลบ rate limit ได้)
    map $remote_addr $client_xff {
        127.0.0.1 $proxy_add_x_forwarded_for;
        ::1       $proxy_add_x_forwarded_for;
        default   $remote_addr;
    }
    map $remote_addr $client_proto {
        127.0.0.1 $http_x_forwarded_proto;
        ::1       $http_x_forwarded_proto;
        default   $scheme;
    }

    # รับทุกชื่อ (โดเมนใหม่ · ngrok · IP ของ VM) — ช่วงนี้ยังให้บริการผ่าน ngrok เป็นหลัก
    server {
        listen 80 default_server;
        server_name _;

        # Let's Encrypt ACME challenge — ต้องมี ^~ ไม่งั้น location ~ /\. (regex) ชนะ prefix ธรรมดาเสมอ
        # ไม่ว่าจะเรียงก่อนหรือหลัง → ตอบ 404 แล้วขอ cert ไม่ผ่าน
        location ^~ /.well-known/acme-challenge/ {
            root C:/letsencrypt/webroot;
            default_type text/plain;
        }

        location ~ /\. {
            deny all;
            return 404;
        }

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $client_xff;
        proxy_set_header X-Forwarded-Proto $client_proto;

        location ~* ^/api/auth/(signin|login) {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:5000;
        }

        # หน้าสถานะเครื่อง (ไม่ต้อง login) — เปิดเฉพาะในเครื่องผ่าน 127.0.0.1:8888 (server ด้านล่าง)
        location ^~ /api/internal-status { return 404; }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://127.0.0.1:5000;
        }

        location /uploads/ {
            proxy_pass http://127.0.0.1:5000;
        }

        root C:/Co_project/Frontend/dist;

        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }

    # หน้าสถานะเครื่อง — ฟังเฉพาะ 127.0.0.1 เปิดได้จากในเครื่อง VM เท่านั้น (http://localhost:8888/status.html)
    server {
        listen 127.0.0.1:8888;
        root   C:/Co_project/Frontend/dist;
        location /api/internal-status {
            proxy_pass http://127.0.0.1:5000/api/internal-status;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
